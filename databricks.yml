# Databricks Asset Bundle: deploys the pipeline as a Workflow job.
# Auth comes from your Databricks CLI profile or DATABRICKS_HOST / DATABRICKS_TOKEN.
bundle:
  name: nyc-taxi-lakehouse

resources:
  jobs:
    taxi_pipeline:
      name: nyc-taxi-pipeline
      # Job parameters are pushed into the notebook widgets of the same name.
      parameters:
        - name: batch_id
          default: "1"
        - name: catalog
          default: workspace
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold.py

targets:
  dev:
    mode: development
    default: true
