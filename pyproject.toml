[project]
name = "taxi-pipeline"
version = "0.1.0"
description = "NYC taxi medallion pipeline with PySpark and Delta Lake"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
